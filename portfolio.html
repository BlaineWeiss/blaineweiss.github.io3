<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Portfolio – Blaine Weiss</title>
    <script>
      (function () {
        try {
          var stored = localStorage.getItem('theme');
          var prefersDark = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches;
          var useDark = stored ? stored === 'dark' : prefersDark;
          if (useDark) document.documentElement.classList.add('dark');
        } catch (e) {}
      })();
    </script>
    <link rel="stylesheet" href="Vendor/bootstrap/bootstrap.min.css" />
    <link rel="stylesheet" href="css/style.css" />
  </head>
  <body>
    <header class="site-header">
      <div class="container">
        <h1 class="logo"><a href="index.html">Blaine Weiss</a></h1>
        <nav class="site-nav">
          <ul>
            <li><a href="index.html">Home</a></li>
            <li><a href="portfolio.html" class="active">Portfolio</a></li>
            <li><a href="publications.html">Publications &amp; CV</a></li>
            <li><a href="tools.html">Tools</a></li>
            <li><a href="profile.html">Profile Card</a></li>
          </ul>
        </nav>
        <button id="mode-toggle" class="mode-toggle" aria-label="Toggle dark/light mode">🌙</button>
      </div>
    </header>

    <main class="container section-spacer">
      <h2>Portfolio</h2>
      <p>Scientific media production highlights from in vivo imaging studies.</p>
      <section class="media-strip large-gap">
        <figure>
          <img src="assets/gifs/TESTsupp1.gif" alt="Awake imaging supplementary footage" />
          <figcaption>Supplementary imaging sequence</figcaption>
        </figure>
        <figure>
          <img src="assets/gifs/AWROITracesFigure.gif" alt="Astrocyte ROI traces animation" />
          <figcaption>Astrocyte ROI traces</figcaption>
        </figure>
        <figure>
          <img src="assets/gifs/placeholder.gif" alt="Video placeholder for additional projects" />
          <figcaption>Additional project reels</figcaption>
        </figure>
      </section>
    </main>

    <footer class="site-footer">
      <div class="container">
        <p>&copy; <span id="year"></span> Blaine Weiss. All rights reserved.</p>
      </div>
    </footer>

    <script src="js/main.js"></script>
  </body>
</html>
